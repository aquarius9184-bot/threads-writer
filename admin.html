<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>작성기 회원 관리</title>
<link rel="icon" href="assets/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Gothic+A1:wght@900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: 앱바 → 요약(대기/승인 수) → 회원 카드 목록. 승인 대기가 맨 위 (작성기 v2와 같은 토큰) */
:root{
  --bg:#F4F5F9;--bg-2:#EAECF3;--surface:#FFFFFF;--surface-2:#F8F9FC;--ink:#141A2E;--ink-2:#454C63;--muted:#7A8099;--line:#E2E5EE;--line-2:#D3D7E3;
  --accent:#FF6B3D;--accent-2:#FF8A5F;--accent-ink:#FFFFFF;--accent-soft:#FFEDE5;--navy:#1B2240;
  --ok:#0F8F67;--ok-soft:#E1F4EC;--warn:#A86200;--warn-soft:#FFF2DA;--bad:#D03A2B;
  --shadow-1:0 1px 2px rgba(20,26,46,.06),0 2px 8px rgba(20,26,46,.05);
  --font-display:"Gothic A1","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0D111D;--bg-2:#141A2A;--surface:#171D2E;--surface-2:#1C2336;--ink:#EEF1F8;--ink-2:#BCC2D6;--muted:#8A92AA;--line:#262E45;--line-2:#323B56;
  --accent:#FF7C52;--accent-2:#FF9670;--accent-ink:#1A0D07;--accent-soft:#3A2017;--navy:#C9D2F2;
  --ok:#3DD3A0;--ok-soft:#12302A;--warn:#F5B558;--warn-soft:#352812;--bad:#FF8A7E;--shadow-1:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.appbar{border-bottom:1px solid var(--line);background:var(--bg);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.appbar .in{max-width:900px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:32px;height:32px;object-fit:contain}
.brand b{font-family:var(--font-display);font-weight:900;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.wrap{max-width:900px;margin:0 auto;padding-block:28px 64px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--font-display);font-weight:900;font-size:clamp(24px,4vw,30px);margin:0;letter-spacing:-.03em}
.box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-1)}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:10px;padding:8px 14px;cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);text-decoration:none;display:inline-block}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.muted{color:var(--muted);font-size:13px;margin:0}
.status{font-size:13px;color:var(--muted);min-height:1.4em;margin:0}
.status.err{color:var(--bad)}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pill{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--muted);display:flex;flex-direction:column}
.pill b{font-family:var(--font-mono);font-weight:500;font-size:24px;color:var(--ink);line-height:1.2;font-variant-numeric:tabular-nums}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.warn b{color:var(--warn)}
.list{display:flex;flex-direction:column;gap:10px}
.user{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center;box-shadow:var(--shadow-1)}
.user.pending{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.who{min-width:0}
.who b{display:block;word-break:break-all;font-weight:700}
.who small{color:var(--muted);font-size:12px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.ctrl label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ctrl input{width:64px;padding:6px 8px;font-family:var(--font-mono);font-size:14px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.wait{background:var(--warn-soft);color:var(--warn)}
.tag.adm{background:var(--bg-2);color:var(--ink-2)}
@media (max-width:600px){.user{grid-template-columns:minmax(0,1fr)}.ctrl{justify-content:flex-start}.pill b{font-size:20px}}
</style>
</head>
<body>
<header class="appbar"><div class="in">
  <div class="brand"><img src="assets/mark.png" alt=""><b>스레드 반응글 작성기</b></div>
  <a class="btn" href="./">작성기로 돌아가기</a>
</div></header>
<div class="wrap">
  <h1>회원 관리</h1>

  <form class="box" id="loginBox" hidden>
    <p class="muted">관리자 계정으로 로그인하세요.</p>
    <input type="email" id="email" placeholder="이메일" autocomplete="email">
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password">
    <div><button class="btn primary" type="submit">로그인</button></div>
  </form>

  <div id="panel" hidden>
    <div class="box">
      <div class="summary" id="summary"></div>
      <p class="muted">승인하면 바로 쓸 수 있어요. 하루 한도는 한국 시간 자정에 다시 채워져요. 한도를 0으로 두면 승인 상태여도 쓸 수 없어요.</p>
    </div>
    <div class="list" id="list" style="margin-top:12px"></div>
  </div>

  <p class="status" id="status" role="status"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://baigxzjlayupkchbmxge.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhaWd4empsYXl1cGtjaGJteGdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MDU2MTMsImV4cCI6MjEwNzk4MTYxM30.VwNiMQPVjw3hcb_WKQP_EpNGjXhxmwJvBj_MF-D-ojQ";
const $=s=>document.querySelector(s);
const status=(t,err)=>{const s=$("#status");s.textContent=t;s.classList.toggle("err",!!err)};
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const today=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul"}).format(new Date());

async function load(){
  const {data:me}=await sb.rpc("my_status");
  if(!me?.is_admin){ $("#panel").hidden=true; $("#loginBox").hidden=false; status("관리자 계정이 아니에요. 관리자 이메일로 로그인해주세요.",true); return }
  $("#loginBox").hidden=true; $("#panel").hidden=false;
  const [{data:users,error},{data:usage}]=await Promise.all([
    sb.from("profiles").select("id,email,approved,is_admin,daily_limit,created_at,must_change_pw").order("created_at",{ascending:false}),
    sb.from("usage").select("user_id,count").eq("day",today()),
  ]);
  if(error){status("회원 목록을 불러오지 못했어요: "+error.message,true);return}
  const used=Object.fromEntries((usage||[]).map(u=>[u.user_id,u.count]));
  users.sort((a,b)=>(a.approved-b.approved)||(b.created_at>a.created_at?1:-1));
  const pend=users.filter(u=>!u.approved).length;
  const sm=$("#summary"); sm.textContent="";
  for(const [t,n,c] of [["승인 대기",pend,pend?"warn":""],["승인됨",users.length-pend,""],["전체",users.length,""]]){
    const p=document.createElement("span");p.className="pill "+c;p.textContent=t;const b=document.createElement("b");b.textContent=n;p.append(b);sm.append(p);
  }
  const list=$("#list"); list.textContent="";
  for(const u of users) list.append(row(u,used[u.id]||0));
  status("");
}
function row(u,usedToday){
  const el=document.createElement("div"); el.className="user"+(u.approved?"":" pending");
  const who=document.createElement("div"); who.className="who";
  const b=document.createElement("b"); b.textContent=u.email;
  const sm=document.createElement("small");
  sm.textContent=`가입 ${new Date(u.created_at).toLocaleDateString("ko-KR")} · 오늘 ${usedToday}회 사용`+(u.must_change_pw?" · 임시 비밀번호(000000) 사용 중":"");
  who.append(b,sm);
  const ctrl=document.createElement("div"); ctrl.className="ctrl";
  const tag=document.createElement("span"); tag.className="tag "+(u.is_admin?"adm":u.approved?"ok":"wait");
  tag.textContent=u.is_admin?"관리자":u.approved?"승인됨":"승인 대기";
  const lab=document.createElement("label"); lab.textContent="하루";
  const lim=document.createElement("input"); lim.type="number"; lim.min="0"; lim.max="500"; lim.value=u.daily_limit; lim.id="lim_"+u.id;
  lim.setAttribute("aria-label",u.email+" 하루 한도");
  lab.append(lim, document.createTextNode("회"));
  const save=document.createElement("button"); save.className="btn"; save.type="button"; save.textContent="한도 저장";
  save.onclick=()=>update(u.id,{daily_limit:Math.max(0,Math.round(Number(lim.value)||0))},save,"한도를 저장했어요.");
  ctrl.append(tag,lab,save);
  if(!u.is_admin){
    const tog=document.createElement("button"); tog.type="button";
    tog.className="btn"+(u.approved?"":" primary"); tog.textContent=u.approved?"승인 취소":"승인";
    tog.onclick=()=>update(u.id,{approved:!u.approved},tog,u.approved?"승인을 취소했어요.":"승인했어요.");
    const rs=document.createElement("button"); rs.type="button"; rs.className="btn"; rs.textContent="비밀번호 초기화";
    let armed=null;
    rs.onclick=()=>{
      if(!armed){ // 실수로 누르지 않게 한 번 더 확인
        rs.textContent="000000으로 초기화할까요? 한 번 더 누르세요"; rs.classList.add("danger");
        armed=setTimeout(()=>{armed=null;rs.textContent="비밀번호 초기화";rs.classList.remove("danger")},4000);
        return;
      }
      clearTimeout(armed); armed=null; rs.classList.remove("danger");
      resetPw(u,rs);
    };
    ctrl.append(tog,rs);
  }
  el.append(who,ctrl);
  return el;
}
async function resetPw(u,btn){
  btn.disabled=true; btn.textContent="초기화하는 중…";
  const {data:{session}}=await sb.auth.getSession();
  let res=null; try{
    res=await fetch(SUPABASE_URL+"/functions/v1/admin-reset-password",{method:"POST",
      headers:{"content-type":"application/json","apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+(session?.access_token||"")},
      body:JSON.stringify({user_id:u.id})});
  }catch{}
  btn.disabled=false; btn.textContent="비밀번호 초기화";
  let b={}; try{b=await res.json()}catch{}
  if(res?.ok){ status(`${u.email} 비밀번호를 000000으로 초기화했어요. 로그인하면 새 비밀번호로 바꾸라는 창이 떠요.`); load(); return }
  const msg={not_admin:"관리자만 초기화할 수 있어요.",target_is_admin:"관리자 계정은 여기서 초기화할 수 없어요.",session_expired:"로그인이 만료됐어요. 다시 로그인해주세요.",not_found:"회원을 찾지 못했어요."}[b.code]||"초기화하지 못했어요. 잠시 뒤 다시 해주세요.";
  status(msg,true);
}
async function update(id,patch,btn,ok){
  btn.disabled=true;
  const {error}=await sb.from("profiles").update(patch).eq("id",id);
  btn.disabled=false;
  if(error){status("저장하지 못했어요: "+error.message,true);return}
  status(ok); load();
}
$("#loginBox").addEventListener("submit",async e=>{
  e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#pw").value});
  if(error){status(/Invalid login/i.test(error.message)?"이메일이나 비밀번호가 맞지 않아요.":error.message,true);return}
  $("#pw").value=""; load();
});
sb.auth.getSession().then(({data})=>{ if(data.session) load(); else $("#loginBox").hidden=false });
</script>
</body>
</html>
